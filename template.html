<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geospatial AI Competitive Digest — Issue 01</title>
<meta name="description" content="A competitive intelligence digest built for geospatial AI and defense, where the standard SaaS CI playbook returns nothing.">
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --bg:#faf8f5; --ink:#14161a; --muted:#6f6862; --faint:#96908a;
    --rule:#e2ddd4; --rule-soft:#eeeae3; --accent:#b4400c; --accent-soft:#f2e6dd;
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131417; --ink:#e9e5df; --muted:#948d85; --faint:#6d675f;
      --rule:#2c2e34; --rule-soft:#212329; --accent:#f0873f; --accent-soft:#2a211b;
    }
  }
  :root[data-theme="dark"]{
    --bg:#131417; --ink:#e9e5df; --muted:#948d85; --faint:#6d675f;
    --rule:#2c2e34; --rule-soft:#212329; --accent:#f0873f; --accent-soft:#2a211b;
  }
  :root[data-theme="light"]{
    --bg:#faf8f5; --ink:#14161a; --muted:#6f6862; --faint:#96908a;
    --rule:#e2ddd4; --rule-soft:#eeeae3; --accent:#b4400c; --accent-soft:#f2e6dd;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:17px; line-height:1.62;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .wrap{max-width:41rem; margin:0 auto; padding:0 1.35rem 5rem}
  @media (min-width:700px){ body{font-size:18px} .wrap{padding:0 2rem 7rem} }

  a{color:inherit}
  p{margin:0 0 1.05em}
  p:last-child{margin-bottom:0}

  /* ---------- masthead ---------- */
  .masthead{padding:3.2rem 0 2.4rem; border-bottom:1px solid var(--rule)}
  .kicker{
    font-family:var(--mono); font-size:.68rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent); margin:0 0 1.1rem;
  }
  .kicker .sep{color:var(--faint); margin:0 .5em}
  h1{
    font-family:var(--serif); font-weight:600; font-size:2.1rem;
    line-height:1.14; letter-spacing:-.015em; margin:0 0 .85rem;
  }
  @media (min-width:700px){ h1{font-size:2.75rem} }
  .standfirst{color:var(--muted); font-size:1.02rem; margin:0; max-width:34rem}
  .byline{
    margin-top:1.6rem; font-family:var(--mono); font-size:.7rem;
    color:var(--faint); letter-spacing:.04em; line-height:1.7;
  }

  /* ---------- sections ---------- */
  section{padding-top:3.4rem}
  .sec-head{margin:0 0 1.5rem}
  .sec-num{
    font-family:var(--mono); font-size:.68rem; letter-spacing:.16em;
    color:var(--accent); display:block; margin-bottom:.5rem;
  }
  h2{
    font-family:var(--serif); font-weight:600; font-size:1.5rem;
    line-height:1.2; letter-spacing:-.01em; margin:0;
  }
  @media (min-width:700px){ h2{font-size:1.8rem} }
  .lede{color:var(--muted); margin-top:.7rem}

  /* ---------- mismatch pairs ---------- */
  .pairs{margin:2rem 0 0; border-top:1px solid var(--rule)}
  .pair{
    display:grid; grid-template-columns:1fr; gap:.3rem;
    padding:.95rem 0; border-bottom:1px solid var(--rule-soft);
  }
  @media (min-width:640px){
    .pair{grid-template-columns:1fr 1fr; gap:1.6rem; align-items:baseline}
  }
  .dead{
    font-family:var(--mono); font-size:.78rem; color:var(--faint);
    text-decoration:line-through; text-decoration-thickness:1px;
  }
  .live{font-size:.95rem; font-weight:500; line-height:1.45}
  .live::before{
    content:"→"; color:var(--accent); margin-right:.5em;
    font-family:var(--mono); font-size:.85em;
  }
  @media (min-width:640px){ .live::before{content:"→ "} }
  .pairs-note{
    margin-top:1.5rem; font-size:.95rem; color:var(--muted);
    padding-left:1rem; border-left:2px solid var(--accent);
  }

  /* ---------- digest entries ---------- */
  .entry{padding:2.6rem 0 2.2rem; border-bottom:1px solid var(--rule)}
  .entry:first-of-type{border-top:1px solid var(--rule); margin-top:2rem}
  .entry-top{
    display:flex; flex-wrap:wrap; align-items:baseline;
    gap:.55rem .8rem; margin-bottom:1rem;
  }
  .rank{font-family:var(--mono); font-size:.7rem; color:var(--faint); letter-spacing:.1em}
  .name{
    font-family:var(--sans); font-weight:600; font-size:1rem;
    letter-spacing:.005em; margin:0;
  }
  .tag{
    font-family:var(--mono); font-size:.6rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted);
    border:1px solid var(--rule); border-radius:2px; padding:.2rem .45rem;
    white-space:nowrap;
  }
  .sowhat{
    font-family:var(--serif); font-weight:500; font-size:1.32rem;
    line-height:1.28; letter-spacing:-.008em; margin:0 0 1.25rem;
  }
  @media (min-width:700px){ .sowhat{font-size:1.55rem} }

  .field{margin:0 0 1.15rem}
  .label{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint);
    display:block; margin-bottom:.3rem;
  }
  .signal{font-size:.94rem; color:var(--muted); margin:0}
  .signal b{color:var(--ink); font-weight:600}

  .action{
    border-left:2px solid var(--accent); padding:.15rem 0 .15rem 1rem;
    margin:1.25rem 0 0;
  }
  .action .label{color:var(--accent)}
  .action p{font-size:.95rem; margin:0}

  /* ---------- disclosure ---------- */
  details{margin-top:1.4rem}
  summary{
    font-family:var(--mono); font-size:.68rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); cursor:pointer;
    list-style:none; display:inline-flex; align-items:center; gap:.45rem;
    padding:.4rem 0; user-select:none;
  }
  summary::-webkit-details-marker{display:none}
  summary::before{
    content:"+"; font-size:.9rem; line-height:1; color:var(--accent);
    width:.7em; display:inline-block;
  }
  details[open] summary::before{content:"–"}
  summary:hover{color:var(--ink)}
  .detail{
    font-size:.9rem; color:var(--muted); padding:.5rem 0 .2rem;
    border-top:1px solid var(--rule-soft); margin-top:.4rem;
  }
  .detail h4{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint);
    margin:1.2rem 0 .35rem; font-weight:400;
  }
  .detail h4:first-child{margin-top:.9rem}
  .srcs{list-style:none; margin:0; padding:0; font-family:var(--mono); font-size:.72rem}
  .srcs li{padding:.4rem 0; border-bottom:1px solid var(--rule-soft); line-height:1.55}
  .srcs li:last-child{border-bottom:none}
  .srcs .d{color:var(--faint)}
  .srcs a{
    color:var(--ink); text-decoration:underline;
    text-decoration-color:var(--accent); text-underline-offset:3px;
    text-decoration-thickness:1px; overflow-wrap:anywhere;
  }
  .srcs a:hover{color:var(--accent)}
  .srcs a::after{content:" ↗"; color:var(--accent); text-decoration:none; font-size:.9em}
  .srcs .nolink{color:var(--muted)}
  .verified{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--faint);
    margin-top:1.4rem; padding-top:.8rem; border-top:1px solid var(--rule);
  }
  @supports (interpolate-size: allow-keywords){
    :root{interpolate-size:allow-keywords}
    details::details-content{
      block-size:0; overflow:hidden;
      transition:block-size .28s ease, content-visibility .28s allow-discrete;
    }
    details[open]::details-content{block-size:auto}
  }

  /* ---------- trajectory ---------- */
  .traj{padding:1.9rem 0; border-bottom:1px solid var(--rule-soft)}
  .traj:first-of-type{border-top:1px solid var(--rule); margin-top:1.9rem}
  .horizon{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent); display:block; margin-bottom:.5rem;
  }
  .traj h3{
    font-family:var(--serif); font-weight:600; font-size:1.18rem;
    line-height:1.28; margin:0 0 .6rem; letter-spacing:-.005em;
  }
  .traj p{font-size:.94rem; color:var(--muted)}
  .position{
    margin-top:.85rem; font-size:.94rem; color:var(--ink);
    padding-left:1rem; border-left:2px solid var(--rule);
  }
  .position b{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint); display:block;
    margin-bottom:.25rem; font-weight:400;
  }

  blockquote{
    margin:3rem 0 0; padding:2.2rem 0 0; border-top:1px solid var(--rule);
    font-family:var(--serif); font-weight:500; font-size:1.65rem;
    line-height:1.24; letter-spacing:-.012em;
  }
  @media (min-width:700px){ blockquote{font-size:2.05rem} }
  blockquote span{color:var(--accent)}
  .qnote{margin-top:1.2rem; font-size:.94rem; color:var(--muted)}

  .risk{
    margin-top:2.4rem; padding:1.4rem 1.3rem;
    background:var(--accent-soft); border-radius:3px;
  }
  .risk .label{color:var(--accent)}
  .risk p{font-size:.94rem; margin:0}

  /* ---------- config ---------- */
  pre{
    margin:1.6rem 0 0; padding:1.2rem 1.1rem; overflow-x:auto;
    background:var(--rule-soft); border-radius:3px;
    font-family:var(--mono); font-size:.72rem; line-height:1.75;
    -webkit-overflow-scrolling:touch;
  }
  @media (min-width:700px){ pre{font-size:.76rem} }
  pre .c{color:var(--faint)}
  pre .k{color:var(--accent)}
  .caption{margin-top:.9rem; font-size:.88rem; color:var(--muted)}

  /* ---------- footer ---------- */
  footer{
    margin-top:4rem; padding-top:2rem; border-top:1px solid var(--rule);
    font-size:.85rem; color:var(--muted);
  }
  footer h5{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint); font-weight:400;
    margin:1.6rem 0 .4rem;
  }
  footer h5:first-child{margin-top:0}
  footer p{font-size:.85rem; margin-bottom:.7em}
</style>
</head>
<body>
<main class="wrap">
<!--CONTENT-->
</main>
</body>
</html>
