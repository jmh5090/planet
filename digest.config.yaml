# digest.config.yaml
cadence:  weekly            # drafted Mon 06:00 PT
output:   single_page_html
review:   required          # no auto-publish. a human approves every issue.

competitors:
  - google        # Earth AI, AlphaEarth, Gemini geospatial reasoning
  - vantor        # Tensorglobe, WorldView, Vantage/Pulse
  - public_data   # Sentinel-2, Landsat — a force, not a company
  - esri          # distribution incumbent
  - lgnd          # Clay lineage, seed stage
  # - iceye       # candidates, not yet enabled
  # - satellogic
  # - umbra

sources:
  sam_gov:        { cadence: daily,     naics: [541370, 541715] }
  usaspending:    { cadence: monthly,   recipients: all }
  arxiv:          { cadence: weekly,    query: "remote sensing foundation model" }
  huggingface:    { cadence: weekly,    watch: [org_releases, model_cards] }
  earnings:       { cadence: quarterly, tickers: [PL, GOOGL], transcripts: true }
  press_releases: { cadence: daily,     feeds: [vantor.com, blog.google, esri.com] }
  api_changelogs: { cadence: weekly,    urls: [developers.google.com/earth-engine] }
  conferences:    { cadence: event,     watch: [GEOINT, GTC, "Esri UC"] }
  funding:        { cadence: weekly,    filter: "earth observation, seed..series_c" }

# deliberately not watched:
#   g2, capterra, trustradius  -> no listings exist for these companies
#   meta / google ad libraries -> no consumer ad spend in this market
#   app store reviews          -> no consumer apps
